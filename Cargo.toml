[package]
name = "sootmark-adapters"
version = "0.2.2"
edition = "2021"
rust-version = "1.80"
description = "One adapter per parser dependency: the parser's native output mapped into the Sootmark model."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/adapters"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "incident-response"]
# Sources only: test fixtures (disk images, logs, test keys) stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[dependencies]
common = { package = "sootmark-common", version = "0.3.4" }
model = { package = "sootmark-model", version = "0.2.0" }
evtx = { package = "sootmark-evtx", version = "0.2.0" }
prefetch = { package = "sootmark-prefetch", version = "0.1.0" }
registry = { package = "sootmark-registry", version = "0.6.2" }
history = { package = "sootmark-history", version = "0.1.0" }
syslog = { package = "sootmark-syslog", version = "0.1.0" }
utmp = { package = "sootmark-utmp", version = "0.1.1" }
shell = { package = "sootmark-shell", version = "0.2.0" }

[dev-dependencies]
conformance = { package = "sootmark-conformance", version = "0.2.0" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
