[package]
name = "sootmark-adapters"
version = "0.2.49"
edition = "2021"
rust-version = "1.80"
description = "One adapter per parser dependency: the parser's native output mapped into the Sootmark model."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/adapters"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "incident-response"]
# Sources only: test fixtures (disk images, logs, test keys) stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[dependencies]
audit = { package = "sootmark-audit", version = "0.1.0" }
browser = { package = "sootmark-browser", version = "0.7.0" }
common = { package = "sootmark-common", version = "0.3.7" }
disk = { package = "sootmark-disk", version = "0.5.0" }
ese = { package = "sootmark-ese", version = "0.1.1" }
evtx = { package = "sootmark-evtx", version = "0.2.0" }
history = { package = "sootmark-history", version = "0.3.0" }
imagecache = { package = "sootmark-imagecache", version = "0.1.0" }
journal = { package = "sootmark-journal", version = "0.1.0" }
macos = { package = "sootmark-macos", version = "0.10.0" }
model = { package = "sootmark-model", version = "0.2.4" }
packages = { package = "sootmark-packages", version = "0.2.0" }
persistence = { package = "sootmark-persistence", version = "0.4.1" }
plist = { package = "sootmark-plist", version = "0.1.0" }
prefetch = { package = "sootmark-prefetch", version = "0.1.0" }
recyclebin = { package = "sootmark-recyclebin", version = "0.1.0" }
registry = { package = "sootmark-registry", version = "0.10.0" }
search = { package = "sootmark-search", version = "0.2.0" }
shell = { package = "sootmark-shell", version = "0.3.0" }
srum = { package = "sootmark-srum", version = "0.1.0" }
syslog = { package = "sootmark-syslog", version = "0.2.0" }
usn = { package = "sootmark-usn", version = "0.1.0" }
utmp = { package = "sootmark-utmp", version = "0.4.0" }
wintimeline = { package = "sootmark-wintimeline", version = "0.1.0" }
wmi = { package = "sootmark-wmi", version = "0.1.1" }
ual = { package = "sootmark-ual", version = "0.1.0" }
winlogs = { package = "sootmark-winlogs", version = "0.4.0" }
defender = { package = "sootmark-defender", version = "0.2.0" }
tasks = { package = "sootmark-tasks", version = "0.1.0" }
weblogs = { package = "sootmark-weblogs", version = "0.3.0" }
cloudlogs = { package = "sootmark-cloudlogs", version = "0.3.0" }
esxi = { package = "sootmark-esxi", version = "0.1.0" }
cups = { package = "sootmark-cups", version = "0.1.0" }
mlocate = { package = "sootmark-mlocate", version = "0.1.0" }
fwlogs = { package = "sootmark-fwlogs", version = "0.1.0" }
indx = { package = "sootmark-indx", version = "0.1.0" }
ntfslog = { package = "sootmark-ntfslog", version = "0.1.0" }
avlogs = { package = "sootmark-avlogs", version = "0.1.1" }
containers = { package = "sootmark-containers", version = "0.1.0" }
eventtranscript = { package = "sootmark-eventtranscript", version = "0.1.0" }
bsm = { package = "sootmark-bsm", version = "0.1.0" }
evt = { package = "sootmark-evt", version = "0.1.0" }
filehistory = { package = "sootmark-filehistory", version = "0.1.0" }
notifications = { package = "sootmark-notifications", version = "0.1.0" }
onedrive = { package = "sootmark-onedrive", version = "0.1.0" }
msiecf = { package = "sootmark-msiecf", version = "0.1.0" }
pe = { package = "sootmark-pe", version = "0.1.0" }
applogs = { package = "sootmark-applogs", version = "0.1.0" }
office = { package = "sootmark-office", version = "0.2.0" }
spotlight = { package = "sootmark-spotlight", version = "0.1.0" }
messengers = { package = "sootmark-messengers", version = "0.1.0" }
cloudsync = { package = "sootmark-cloudsync", version = "0.1.0" }
bits = { package = "sootmark-bits", version = "0.1.0" }
unifiedlog = { package = "sootmark-unifiedlog", version = "0.1.0" }

[dev-dependencies]
conformance = { package = "sootmark-conformance", version = "0.2.0" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"

# The SRUM test database is 10 MB once decompressed: an optimised inflater
# and ESE reader keep the test run short.
[profile.dev.package.sootmark-common]
opt-level = 3
[profile.dev.package.sootmark-ese]
opt-level = 3
# The unified log tests read shared cache strings files of up to 160 MB: an
# optimised reader keeps the run short.
[profile.dev.package.sootmark-unifiedlog]
opt-level = 3
# Every key of the test hives is read, and read again for each damaged
# variant the conformance checks try: an optimised hive reader keeps the
# run short.
[profile.dev.package.sootmark-registry]
opt-level = 3
